name: "Package built kernel"
description: "Packages the built kernel into a flashable zip using AnyKernel3."
author: "frstprjkt"

runs:
  using: "composite"
  steps:
    - name: "Package kernel with AnyKernel3"
      shell: bash
      run: |
        set -e
        KERNEL_DIR="$HOME/kernel/${{ inputs.arch }}"
        ANYKERNEL_DIR="$HOME/anykernel3"
        OUTPUT_ZIP="$HOME/${{ inputs.package-name }}"

        echo "Cloning AnyKernel3 from ${{ inputs.anykernel3-url }} (branch: ${{ inputs.anykernel3-branch }})..."
        git clone --depth=1 --branch=${{ inputs.anykernel3-branch }} ${{ inputs.anykernel3-url }} $ANYKERNEL_DIR

        echo "Copying built kernel to AnyKernel3 directory..."
        cp $KERNEL_DIR/out/arch/${{ inputs.arch }}/Image.gz $ANYKERNEL_DIR/.
        # Add other necessary files like dtb, dtbo if available
        if [ -f "$KERNEL_DIR/out/arch/${{ inputs.arch }}/dtb" ]; then
          cp $KERNEL_DIR/out/arch/${{ inputs.arch }}/dtb $ANYKERNEL_DIR/.
        fi
        if [ -f "$KERNEL_DIR/out/arch/${{ inputs.arch }}/dtbo.img" ]; then
          cp $KERNEL_DIR/out/arch/${{ inputs.arch }}/dtbo.img $ANYKERNEL_DIR/.
        fi

        echo "Creating flashable zip package..."
        cd $ANYKERNEL_DIR
        zip -r9 $OUTPUT_ZIP ./*

        echo "Kernel packaged successfully: $OUTPUT_ZIP"

