name: "Install build dependencies"
description: "Installs necessary dependencies for building Android kernels."
author: "frstprjkt"

runs:
  using: "composite"
  steps:
    - name: "Install required packages"
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          binutils git make bc bison openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev libc6-dev device-tree-compiler ca-certificates \
          python3 xz-utils aria2 build-essential
