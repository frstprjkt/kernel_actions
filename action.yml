name: "Android Kernel Builder"
description: "An action to build Android kernel using GitHub Actions"
author: "frstprjkt"

inputs:
  debug:
    description: "Enable debug mode for verbose output"
    required: false
    default: "false"

  kernel-url:
    description: "Git URL of the kernel source (required)"
    required: true
  kernel-branch:
    description: "Kernel source branch to build"
    required: false
    default: "master"
  depth:
    description: "Git clone depth for kernel source (enabled by default)"
    required: false
    default: "1"

  arch:
    description: "Target architecture (required)"
    required: false
    default: "arm64"
  defconfig:
    description: "Kernel defconfig to use for the build (required)"
    required: true
  extra-args:
    description: "Extra arguments to pass to the make command (optional)"
    required: false
  build-number:
    description: "Custom build number to embed in the kernel version (optional)"
    required: false

  ksu:
    description: "Enable KernelSU integration"
    required: false
    default: "false"
  ksu-url:
    description: "Git URL of the KernelSU repository"
    required: false
    default: "https://github.com/tiann/KernelSU"
  ksu-version:
    description: "KernelSU version to integrate (branch, tag, or commit)"
    required: false
    default: "main"

  aosp-clang:
    description: "Use AOSP clang toolchain for building"
    required: false
    default: "true"
  aosp-clang-version:
    description: "AOSP clang version to use (e.g. r563880c)"
    required: false
    default: "r563880c"
  aosp-gcc:
    description: "Use AOSP GCC toolchain for building"
    required: false
    default: "false"

  anykernel3:
    description: "Package the built kernel using AnyKernel3"
    required: false
    default: "false"
  anykernel3-url:
    description: "Git URL of the AnyKernel3 repository (needed if anykernel3 is true)"
    required: false
  anykernel3-branch:
    description: "AnyKernel3 branch to use for packaging"
    required: false
    default: "master"
  package-name:
    description: "Base name for the output package (without extension)(used for both AnyKernel3 and boot image packaging)"
    required: false
    default: "anykernel3.zip"

  bootimg:
    description: "Package the built kernel as a boot image"
    required: false
    default: "false"
  bootimg-url:
    description: "Stock boot image URL to use for repacking with the new kernel (required if bootimg is true)"
    required: false

  artifact-upload:
    description: "Upload the built kernel as an artifact in GitHub Actions"
    required: false
    default: "false"

  telegram-upload:
    description: "Upload the built kernel to Telegram"
    required: false
    default: "false"
  telegram-bot-token:
    description: "Telegram bot token for uploading the kernel (required if telegram-upload is true)"
    required: false
  telegram-chat-id:
    description: "Telegram chat ID to send the kernel to (required if telegram-upload is true)"
    required: false
  telegram-caption:
    description: "Caption to use when uploading the kernel to Telegram (optional)"
    required: false

runs:
  using: "composite"
  steps:
    - name: "Prepare run_cmd helper"
      shell: bash
      run: |
        echo "DEBUG=${{ inputs.debug }}" >> "$GITHUB_ENV"

        cat <<'EOF' > $HOME/run_cmd.sh
        set -e
        run_cmd() {
          if [[ "$DEBUG" == "true" ]]; then
            eval "$@"
          else
            eval "$@" >/dev/null 2>&1
          fi
        }
        EOF

    - name: "Send build start notification to Telegram"
      if: ${{ inputs.telegram-upload == 'true' }}
      shell: bash
      run: |
        source $HOME/run_cmd.sh

        echo "Sending build start notification to Telegram..."
        NOTIFIER_MSG="${GITHUB_REPOSITORY}/${GITHUB_WORKFLOW} triggered by ${GITHUB_TRIGGERING_ACTOR} (${GITHUB_EVENT_NAME})"
        run_cmd "curl -v -F \"chat_id=${{ inputs.telegram-chat-id }}\" \
                  -F text=\"$NOTIFIER_MSG\" \
                  https://api.telegram.org/bot${{ inputs.telegram-bot-token }}/sendMessage"

    - name: "Setup build environment"
      shell: bash
      run: |
        source $HOME/run_cmd.sh

        echo "Setting up build environment..."
        echo "KERNEL_DIR=$HOME/kernel/${{ inputs.arch }}" >> $GITHUB_ENV

        if [[ "${{ inputs.bootimg }}" == "true" ]]; then
          echo "PACKAGE_NAME=image-${{ inputs.package-name }}" >> $GITHUB_ENV
        else
          echo "PACKAGE_NAME=${{ inputs.package-name }}" >> $GITHUB_ENV
        fi

        run_cmd "sudo apt-get update"
        run_cmd "sudo apt-get install -y \
          binutils git make bc bison openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev libc6-dev device-tree-compiler ca-certificates \
          python3 xz-utils aria2 build-essential"

    - name: "Download AOSP Clang"
      if: ${{ inputs.aosp-clang == 'true' }}
      shell: bash
      run: |
        source $HOME/run_cmd.sh

        TOOLCHAIN_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-${{ inputs.aosp-clang-version }}.tar.gz"
        echo "Downloading AOSP clang version ${{ inputs.aosp-clang-version }}..."
        mkdir -p $HOME/toolchains/clang-${{ inputs.aosp-clang-version }}
        run_cmd "aria2c -x 16 -s 16 -k 1M $TOOLCHAIN_URL -o clang.tar.gz"
        run_cmd "tar -xzvf clang.tar.gz -C $HOME/toolchains/clang-${{ inputs.aosp-clang-version }}"
        rm clang.tar.gz

    - name: "Download AOSP GCC"
      if: ${{ inputs.aosp-gcc == 'true' }}
      shell: bash
      run: |
        source $HOME/run_cmd.sh

        GCC64_URL="https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android-msm-redbull-4.19-android14-qpr3.tar.gz"
        echo "Downloading AOSP GCC aarch64 version..."
        mkdir -p $HOME/toolchains/gcc-aarch64
        run_cmd "aria2c -x 16 -s 16 -k 1M $GCC64_URL -o aarch64-gcc.tar.gz"
        run_cmd "tar -xzvf aarch64-gcc.tar.gz -C $HOME/toolchains/gcc-aarch64"

        GCC32_URL="https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/heads/android-msm-redbull-4.19-android14-qpr3.tar.gz"
        echo "Downloading AOSP GCC arm32 version..."
        mkdir -p $HOME/toolchains/gcc-arm32
        run_cmd "aria2c -x 16 -s 16 -k 1M $GCC32_URL -o arm32-gcc.tar.gz"
        run_cmd "tar -xzvf arm32-gcc.tar.gz -C $HOME/toolchains/gcc-arm32"
        rm aarch64-gcc.tar.gz arm32-gcc.tar.gz

    - name: "Downloading kernel source"
      shell: bash
      run: |
        source $HOME/run_cmd.sh

        echo "Cloning kernel source (branch: ${{ inputs.kernel-branch }}, depth: ${{ inputs.depth }})..."
        run_cmd "git clone --depth=${{ inputs.depth }} --branch=${{ inputs.kernel-branch }} ${{ inputs.kernel-url }} $KERNEL_DIR"

        echo "Extracting kernel version information..."
        echo "KERNEL_VERSION=$(grep -E '^VERSION =' "$KERNEL_DIR/Makefile" | awk '{print $3}')" >> $GITHUB_ENV
        echo "KERNEL_PATCHLEVEL=$(grep -E '^PATCHLEVEL =' "$KERNEL_DIR/Makefile" | awk '{print $3}')" >> $GITHUB_ENV
        echo "KERNEL_SUBLEVEL=$(grep -E '^SUBLEVEL =' "$KERNEL_DIR/Makefile" | awk '{print $3}')" >> $GITHUB_ENV
        echo "KERNEL_EXTRAVERSION=$(grep -E '^EXTRAVERSION =' "$KERNEL_DIR/Makefile" | awk '{print $3}')" >> $GITHUB_ENV

    - name: "Configure KernelSU"
      if: ${{ inputs.ksu == 'true' }}
      shell: bash
      run: |
        source $HOME/run_cmd.sh

        echo "Configuring KernelSU integration..."
        cd $KERNEL_DIR
        run_cmd "curl -LSs \"${{ inputs.ksu-url }}/raw/${{ inputs.ksu-version }}/kernel/setup.sh\" | bash -s ${{ inputs.ksu-version }}"
        cd -

        if [ $KERNEL_VERSION -lt 5 ]; then
          echo "Enabling KernelSU hooks..."
          echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y" > $KERNEL_DIR/arch/${{ inputs.arch }}/configs/kernelsu.config
        else
          echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE only supported on kernels < 5.x. Expect your have manual hooks integration."
        fi

    - name: "Building Kernel"
      shell: bash
      run: |
        source $HOME/run_cmd.sh

        echo "Kernel Version: "$KERNEL_VERSION.$KERNEL_PATCHLEVEL.$KERNEL_SUBLEVEL""$KERNEL_EXTRAVERSION""

        KERNEL_DEFCONFIG="${{ inputs.defconfig }}"
        if [ "${{ inputs.ksu }}" = "true" ]; then
          KERNEL_DEFCONFIG+=" kernelsu.config"
        fi

        if [[ -n "${{ inputs.build-number }}" ]]; then
          export BUILD_NUMBER="${{ inputs.build-number }}"
        fi

        if [ "${{ inputs.aosp-clang }}" = "true" ]; then
          echo "AOSP Clang path: $HOME/toolchains/clang-${{ inputs.aosp-clang-version }}/bin"
          export PATH=$HOME/toolchains/clang-${{ inputs.aosp-clang-version }}/bin:$PATH
        fi
        if [ "${{ inputs.aosp-gcc }}" = "true" ]; then
          echo "AOSP GCC aarch64 path: $HOME/toolchains/gcc-aarch64/bin"
          echo "AOSP GCC arm32 path: $HOME/toolchains/gcc-arm32/bin"
          export PATH=$HOME/toolchains/gcc-aarch64/bin:$HOME/toolchains/gcc-arm32/bin:$PATH
        fi

        if [[ "${{ inputs.arch }}" == "arm64" ]]; then
          BUILD_CLANG_TRIPLE="aarch64-linux-gnu-"
        elif [[ "${{ inputs.arch }}" == "arm" ]]; then
          BUILD_CLANG_TRIPLE="arm-linux-gnueabi-"
        fi

        if [ "${{ inputs.aosp-gcc }}" = "true" ]; then
          BUILD_CROSS_COMPILE=aarch64-linux-android-
          BUILD_CROSS_COMPILE_ARM32=arm-linux-androideabi-
        fi

        cd $KERNEL_DIR
        mkdir out
        echo "${GITHUB_RUN_NUMBER}" > out/.version
        echo "Starting kernel build for architecture: ${{ inputs.arch }} with defconfig: $KERNEL_DEFCONFIG"
        run_cmd "make -j$(nproc) ARCH=${{ inputs.arch }} O=out $KERNEL_DEFCONFIG ${{ inputs.extra-args }} all CROSS_COMPILE=$BUILD_CROSS_COMPILE CROSS_COMPILE_ARM32=$BUILD_CROSS_COMPILE_ARM32 CLANG_TRIPLE=$BUILD_CLANG_TRIPLE"
        echo "Kernel build completed."
    
    - name: "Packaging Kernel with AnyKernel3"
      if: ${{ inputs.anykernel3 == 'true' }}
      shell: bash
      run: |
        source $HOME/run_cmd.sh

        ANYKERNEL_DIR="$HOME/anykernel3"
        echo "Cloning AnyKernel3 (branch: ${{ inputs.anykernel3-branch }})..."
        run_cmd "git clone --depth=1 --branch=${{ inputs.anykernel3-branch }} ${{ inputs.anykernel3-url }} $ANYKERNEL_DIR"

        echo "Cleaning AnyKernel3 directory..."
        rm -rf $ANYKERNEL_DIR/.git $ANYKERNEL_DIR/*.github
        find . -type f -name "placeholder" -exec sh -c 'rm -rf "$(dirname "$1")"' _ {} \;

        echo "Copying built kernel to AnyKernel3 directory..."
        cp $KERNEL_DIR/out/arch/${{ inputs.arch }}/boot/Image.gz $ANYKERNEL_DIR/.
        # Add other necessary files like dtb, dtbo if available
        if [ -f "$KERNEL_DIR/out/arch/${{ inputs.arch }}/boot/dtb" ]; then
          cp $KERNEL_DIR/out/arch/${{ inputs.arch }}/boot/dtb $ANYKERNEL_DIR/.
        fi
        if [ -f "$KERNEL_DIR/out/arch/${{ inputs.arch }}/boot/dtbo.img" ]; then
          cp $KERNEL_DIR/out/arch/${{ inputs.arch }}/boot/dtbo.img $ANYKERNEL_DIR/.
        fi

        if [[ "${{ inputs.telegram-upload }}" == "true" ]]; then
          cd $ANYKERNEL_DIR
          run_cmd "zip -r9 $HOME/${{ env.PACKAGE_NAME }}.zip ."
          echo "OUTPUT_FILE=$HOME/${{ env.PACKAGE_NAME }}.zip" >> $GITHUB_ENV
          echo "Kernel packaged successfully. Output file: $HOME/${{ env.PACKAGE_NAME }}.zip"
        elif [[ "${{ inputs.artifact-upload }}" == "true" ]]; then
          echo "OUTPUT_DIR=$ANYKERNEL_DIR" >> $GITHUB_ENV
          echo "Kernel packaged successfully. Output directory: $ANYKERNEL_DIR"
        fi

    - name: "Packaging Kernel with boot image"
      if: ${{ inputs.bootimg == 'true' }}
      shell: bash
      run: |
        source $HOME/run_cmd.sh

        echo "Downloading required tools for boot image packaging..."
        mkdir $HOME/working
        cd $HOME/working
        run_cmd "wget https://raw.githubusercontent.com/frstprjkt/kernel_actions/refs/heads/main/bin/magiskboot -O magiskboot"
        chmod +x magiskboot

        echo "Unpacking stock boot image..."
        run_cmd "wget ${{ inputs.bootimg-url }} -O boot.orig.img"
        run_cmd "./magiskboot unpack boot.orig.img"

        if [ -f "$KERNEL_DIR/out/arch/${{ inputs.arch }}/boot/Image" ]; then
          echo "Replacing kernel in the unpacked boot image..."
          cp $KERNEL_DIR/out/arch/${{ inputs.arch }}/boot/Image kernel
        fi

        if [ -f "$KERNEL_DIR/out/arch/${{ inputs.arch }}/boot/dtb" ]; then
          echo "Replacing dtb in the unpacked boot image..."
          cp $KERNEL_DIR/out/arch/${{ inputs.arch }}/boot/dtb dtb
        fi

        echo "Repacking boot image with the new kernel..."
        mkdir out_img
        run_cmd "./magiskboot repack boot.orig.img out_img/boot.img"
        echo "Boot image repackaged successfully."

        if [ -f "$KERNEL_DIR/out/arch/${{ inputs.arch }}/boot/dtbo.img" ]; then
          echo "Adding dtbo to the output directory..."
          cp $KERNEL_DIR/out/arch/${{ inputs.arch }}/boot/dtbo.img out_img/dtbo.img
        fi

        if [[ "${{ inputs.telegram-upload }}" == "true" ]]; then
          cd out_img
          run_cmd "zip -r9 $HOME/${{ env.PACKAGE_NAME }}.zip ."
          echo "OUTPUT_FILE=$HOME/${{ env.PACKAGE_NAME }}.zip" >> $GITHUB_ENV
          echo "Kernel packaged successfully. Output file: $HOME/${{ env.PACKAGE_NAME }}.zip"
        elif [[ "${{ inputs.artifact-upload }}" == "true" ]]; then
          echo "OUTPUT_DIR=$HOME/working/out_img" >> $GITHUB_ENV
          echo "Kernel packaged successfully. Output directory: $HOME/working/out_img"
        fi

    - name: "Upload Kernel to Artifacts"
      if: ${{ inputs.artifact-upload == 'true' }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.PACKAGE_NAME }}
        path: ${{ env.OUTPUT_DIR }}
        if-no-files-found: error

    - name: "Upload Kernel to Telegram"
      if: ${{ inputs.telegram-upload == 'true' }}
      shell: bash
      run: |
        source $HOME/run_cmd.sh

        run_cmd "curl -v -F \"chat_id=${{ inputs.telegram-chat-id }}\" \
          -F document=@${{ env.OUTPUT_FILE }} \
          -F caption=\"${{ inputs.telegram-caption }}\" \
          https://api.telegram.org/bot${{ inputs.telegram-bot-token }}/sendDocument"
